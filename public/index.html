<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔女茶会</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1025; color: #e8d5f0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; display: flex; justify-content: center; }
#app { max-width: 600px; width: 100%; padding: 20px; }
h1 { text-align: center; color: #c9a0dc; margin-bottom: 16px; font-size: 1.4em; }
#log { background: #2a1a3a; border-radius: 8px; padding: 12px; height: 340px; overflow-y: auto; font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
#log .sys { color: #a080c0; }
#log .info { color: #d4b8e8; }
#log .warn { color: #e8a0a0; }
#log .chat { color: #b0e0ff; }
#actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { background: #4a2a6a; color: #e8d5f0; border: 1px solid #7a5a9a; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
button:hover { background: #5a3a7a; }
button:disabled { opacity: 0.4; cursor: default; }
input[type="number"], input[type="text"] { width: 80px; padding: 8px; border-radius: 6px; border: 1px solid #7a5a9a; background: #2a1a3a; color: #e8d5f0; font-size: 14px; }
input[type="text"] { width: 140px; }
#status { background: #2a1a3a; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <h1>🫖 魔女茶会</h1>
  <div id="status">等待连接...</div>
  <div id="log"></div>
  <div id="actions"></div>
</div>
<script>
const log = document.getElementById('log');
const actions = document.getElementById('actions');
const status = document.getElementById('status');
let ws, playerId, myNumber, myMana, currentRoom, phase, anonMap = {};

function addLog(text, cls = 'info') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setActions(html) { actions.innerHTML = html; }

function send(type, data = {}) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type, ...data }));
  }
}

function getWsUrl() {
  // 如果是 file:// 协议，location.host 为空，默认连 localhost:3000
  if (!location.host) {
    return 'ws://localhost:3000';
  }
  // 否则使用当前页面的 host
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${protocol}//${location.host}`;
}

function connect() {
  const url = getWsUrl();
  addLog(`正在连接: ${url}...`, 'sys');
  
  try {
    ws = new WebSocket(url);
  } catch (e) {
    addLog(`连接失败: ${e.message}`, 'warn');
    return;
  }

  ws.onopen = () => addLog('已连接至茶会...', 'sys');
  
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handle(msg);
    } catch (err) {
      console.error('解析消息失败', err);
    }
  };
  
  ws.onclose = () => addLog('连接断开', 'warn');
  
  ws.onerror = (err) => {
    addLog('WebSocket 错误', 'warn');
    console.error(err);
  };
}

function handle(msg) {
  switch (msg.type) {
    case 'joined':
      playerId = msg.playerId;
      status.textContent = `等待中... ${msg.total}/${msg.max}`;
      addLog(`你已加入，ID: ${playerId}`);
      break;

    case 'player_joined':
      status.textContent = `等待中... ${msg.total}/${msg.max}`;
      addLog(`${msg.displayName} 加入了茶会 (${msg.total}/${msg.max})`, 'sys');
      break;

    case 'phase_change':
      phase = msg.phase;
      addLog(`━━━ ${msg.phase} ━━━`, 'sys');
      if (msg.ending) addLog(msg.ending, 'warn');
      setActions(''); // 切换阶段时清空操作栏
      break;

    case '序章':
      myNumber = msg.number;
      myMana = msg.mana;
      addLog(`你的幸运数字: ${myNumber}  魔力: ${myMana}`);
      if (msg.uninvited) addLog('（你是不受邀请之人...）', 'warn');
      break;

    case 'room_assign':
      currentRoom = msg.roomId;
      if (msg.roomType === 'empty') {
        addLog('你进入了空房间，静静等待...', 'sys');
        setActions('<p>空房间中，无需猜测，等待幕间...</p>');
      } else {
        addLog(`进入虚拟房间，对手: ${msg.opponent}  剩余猜测: ${msg.guessesLeft}`);
        setActions(`
          <input type="number" id="guessInput" min="1" max="13" placeholder="1-13">
          <button onclick="submitGuess()">猜测</button>
          <button onclick="skipGuess()">放弃猜测</button>
        `);
      }
      break;

    case 'guess_result':
      if (msg.result === 'win') {
        addLog(`🎯 猜测结算: 你赢了！魔力: ${msg.mana}`, 'warn');
      } else if (msg.result === 'lose') {
        addLog(`💔 猜测结算: 你输了。魔力: ${msg.mana}`, 'warn');
      } else if (msg.result === 'draw') {
        addLog(`⚖️ 猜测结算: 平局。魔力: ${msg.mana}`, 'warn');
      } else if (msg.result === 'skipped') {
        addLog('对方放弃了猜测，本局无效。', 'sys');
      }
      myMana = msg.mana;
      break;

    case 'return_garden':
      addLog('回到花园。', 'sys');
      setActions('');
      break;

    case 'player_died':
      addLog(`💀 ${msg.displayName} 魔力耗尽，消失了...`, 'warn');
      break;

    case 'number_reset':
      anonMap = msg.maps[playerId] || {};
      addLog('匿名编号已重置。', 'sys');
      break;

    case 'interlude_invite':
      addLog(`${msg.fromName} 邀请你进入幕间私聊。`, 'sys');
      setActions(`
        <button onclick="acceptInterlude('${msg.fromId}')">接受</button>
        <button onclick="declineInterlude()">拒绝</button>
      `);
      break;

    case 'interlude_connected':
      addLog(`已与 ${msg.peerName} 建立私聊连接。`, 'sys');
      setActions(`
        <input type="text" id="chatInput" placeholder="输入消息...">
        <button onclick="sendChat('${msg.peerId}')">发送</button>
      `);
      break;

    case 'interlude_message':
      addLog(`[私聊] ${msg.message}`, 'chat');
      break;

    case 'final_available':
      addLog('⚠️ 有魔女魔力达到5，终章即将触发！', 'warn');
      msg.candidates.forEach(c => {
        addLog(`  候选人: ${c.displayName} (魔力: ${c.mana})`, 'sys');
      });
      break;

    case 'error':
      addLog(`错误: ${msg.message}`, 'warn');
      break;

    default:
      // 忽略未知消息或用于调试
      // addLog(`[未知消息] ${JSON.stringify(msg)}`, 'sys');
      break;
  }
}

// ── 操作函数 ──

function submitGuess() {
  const input = document.getElementById('guessInput');
  const val = parseInt(input.value);
  if (isNaN(val) || val < 1 || val > 13) {
    addLog('请输入 1-13 之间的数字', 'warn');
    return;
  }
  send('submit_guess', { number: val });
  input.value = '';
  addLog(`已提交猜测: ${val}`);
}

function skipGuess() {
  send('skip_guess');
  addLog('你放弃了本轮猜测。', 'sys');
}

function acceptInterlude(fromId) {
  send('interlude_accept', { fromId });
}

function declineInterlude() {
  addLog('你拒绝了私聊邀请。', 'sys');
  setActions('');
}

function sendChat(toId) {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  send('interlude_message', { toId, message: msg });
  addLog(`[你] ${msg}`, 'chat');
  input.value = '';
}

// 启动
connect();
</script>
</body>
</html>
