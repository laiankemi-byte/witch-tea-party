<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔女茶会</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1a1025;
      color: #e9dff6;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    #log {
      border: 1px solid #3b2a54;
      background: #0f0a18;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3b2a54;
      background: #120c1e;
      color: #e9dff6;
    }
    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #6b3fa0;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🫖 魔女茶会</h1>
  <div id="log"></div>
  <div class="row">
    <input id="msg" placeholder="输入消息..." />
    <button onclick="send()">发送</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("msg");

    function append(text) {
      const p = document.createElement("div");
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    function getWsUrl() {
      if (location.protocol === "https:") {
        return "wss://" + location.host;
      }
      if (location.protocol === "http:" && location.host) {
        return "ws://" + location.host;
      }
      return "ws://localhost:3000";
    }

    let ws = new WebSocket(getWsUrl());

    ws.onopen = () => append("已连接茶会。");
    ws.onmessage = (e) => append(e.data);
    ws.onclose = () => append("连接已断开。");
    ws.onerror = () => append("连接出错，请刷新页面重试。");

    function send() {
      const text = input.value.trim();
      if (!text) return;
      if (ws.readyState === 1) {
        ws.send(text);
        input.value = "";
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
